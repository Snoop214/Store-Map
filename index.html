<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS_Operations & Territory Optimizer</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* UI/UX & Design System - Enterprise Dashboard Theme */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary-orange: #FF5A00;
            --primary-orange-hover: #E04E00;
            --bg-light: #F4F7F9;
            --bg-card: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --sidebar-width: 320px;
            
            /* Status Colors */
            --status-green: #10B981;
            --status-yellow: #F59E0B;
            --status-red: #EF4444;
            --status-blue: #3B82F6;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow: hidden;
        }

        /* --- TOP NAVIGATION HEADER --- */
        .app-header {
            height: 64px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 1px 10px rgba(0,0,0,0.03);
            z-index: 2000;
        }

        .header-left { display: flex; align-items: center; gap: 40px; }

        .logo {
            color: var(--primary-orange);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .tabs { display: flex; gap: 10px; }

        .tab-btn {
            background: #F1F5F9;
            color: var(--text-muted);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { background: #E2E8F0; color: var(--text-dark); }
        .tab-btn.active { background: var(--primary-orange); color: #FFF; box-shadow: 0 2px 8px rgba(255, 90, 0, 0.25); }

        .database-status {
            display: flex; align-items: center; gap: 12px;
            background: #F8FAFC; border: 1px solid var(--border-color);
            padding: 6px 14px; border-radius: 20px;
        }

        .db-icon { width: 10px; height: 10px; border-radius: 50%; background-color: var(--status-yellow); box-shadow: 0 0 0 3px #FEF3C7; transition: background-color 0.3s;}
        .db-icon.live { background-color: var(--status-green); box-shadow: 0 0 0 3px #D1FAE5; }
        
        .db-text { font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .db-text strong { color: var(--text-dark); }

        /* --- MAIN APP LAYOUT --- */
        .app-body { display: flex; flex-grow: 1; height: calc(100vh - 64px); position: relative; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar-container {
            position: relative; width: var(--sidebar-width); height: 100%;
            background-color: var(--bg-card); border-right: 1px solid var(--border-color);
            box-shadow: 2px 0 20px rgba(0,0,0,0.03); z-index: 1000;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex;
        }

        .sidebar-container.collapsed { width: 35px; }
        .sidebar-content-wrapper { width: 100%; height: 100%; overflow: hidden; }

        .sidebar-content {
            width: var(--sidebar-width); height: 100%; padding: 20px;
            box-sizing: border-box; display: flex; flex-direction: column;
            transition: opacity 0.2s ease;
        }

        .sidebar-container.collapsed .sidebar-content { opacity: 0; pointer-events: none; }

        .sidebar-toggle {
            position: absolute; top: 50%; transform: translateY(-50%); right: -34px; 
            width: 34px; height: 100px; background-color: var(--bg-card);
            border: 1px solid var(--border-color); border-left: none; border-radius: 0 8px 8px 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--primary-orange); box-shadow: 3px 0 8px rgba(0,0,0,0.06); z-index: 1001;
        }

        .sidebar-container.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
        .sidebar-toggle svg { width: 28px; height: 28px; transition: transform 0.3s ease; }

        .control-group { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; margin-bottom: 15px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 4px; }
        label.section-title { font-weight: 800; font-size: 11px; text-transform: uppercase; color: var(--text-dark); letter-spacing: 0.5px; }
        .shortcut-btn { font-size: 10px; color: var(--primary-orange); background: none; border: none; cursor: pointer; font-weight: 700; padding: 0;}
        .shortcut-btn:hover { text-decoration: underline; }

        .checkbox-list {
            background-color: var(--bg-light); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px 12px; flex: 1 1 auto; overflow-y: auto; min-height: 0;
        }
        .checkbox-list::-webkit-scrollbar { width: 6px; }
        .checkbox-list::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }

        .checkbox-item { display: flex; align-items: center; margin-bottom: 10px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .checkbox-item input { margin-right: 10px; cursor: pointer; width: 14px; height: 14px; accent-color: var(--primary-orange); flex-shrink: 0;}
        .color-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); flex-shrink: 0;}
        .count-badge { color: var(--text-muted); font-size: 10px; margin-left: auto; background: #E2E8F0; padding: 2px 7px; border-radius: 10px; font-weight: 700; flex-shrink: 0; }

        /* --- CONTENT CONTAINERS --- */
        .main-content { flex-grow: 1; height: 100%; position: relative; }
        #map-container { height: 100%; width: 100%; position: relative;}
        #map { height: 100%; width: 100%; }
        
        /* --- MAP CONTROLS OVERLAY (MAIN MAP) --- */
        .map-search-wrapper {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            display: flex; flex-direction: column; gap: 6px; width: 380px;
        }

        .map-search-bar {
            display: flex; gap: 8px; background: white; padding: 8px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); align-items: center; width: 100%; box-sizing: border-box;
        }

        .map-search-input {
            border: none; background: #F8FAFC; padding: 10px 12px; border-radius: 6px;
            font-size: 13px; font-family: 'Inter', sans-serif; flex-grow: 1; outline: 1px solid #E2E8F0; width: 100%;
        }
        .map-search-input:focus { outline: 2px solid var(--primary-orange); background: white;}

        .map-action-btn {
            background: white; border: 1px solid #E2E8F0; color: var(--text-dark); border-radius: 6px;
            padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s ease;
        }
        .map-action-btn:hover { background: #F1F5F9; border-color: #CBD5E1; }
        
        .pulse-loc-btn { color: var(--status-blue) !important; font-weight: 800; border-color: #BFDBFE; white-space: nowrap;}
        .pulse-loc-btn:hover { background: #EFF6FF !important; }

        /* Search Dropdown Suggestions */
        .suggestions-dropdown {
            background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            max-height: 250px; overflow-y: auto; display: none; width: 100%; border: 1px solid var(--border-color); box-sizing: border-box;
        }
        
        .suggestion-item {
            padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border-color);
            cursor: pointer; color: var(--text-dark); transition: background 0.2s; line-height: 1.4;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #FFF5F0; }

        /* --- TALABAT UI (BOTTOM SHEET OVERLAY) --- */
        .bottom-sheet {
            position: absolute; bottom: -150%; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 450px; background: white; border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2); padding: 24px; z-index: 2000;
            transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
            max-height: 85vh; overflow-y: auto;
        }
        .bottom-sheet.active { bottom: 0; }
        
        /* Talabat X Close Button */
        .sheet-close-btn {
            position: absolute; top: 20px; right: 20px; width: 32px; height: 32px;
            background: #F1F5F9; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; color: var(--text-muted); cursor: pointer; transition: 0.2s; z-index: 10;
        }
        .sheet-close-btn:hover { background: #E2E8F0; color: var(--text-dark); }

        .sheet-handle { width: 40px; height: 4px; background: #CBD5E1; border-radius: 2px; margin: 0 auto 5px auto; flex-shrink: 0; }
        
        .sheet-title { font-size: 18px; font-weight: 800; color: var(--text-dark); margin: 0; padding-right: 30px;}
        .sheet-subtitle { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 5px;}
        
        /* Interactive Route Info Box (Dropdowns) */
        .route-info-wrapper {
            display: flex; align-items: center; gap: 12px; margin-bottom: 4px;
        }
        .route-info {
            background: #F8FAFC; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; 
            display: flex; flex-direction: column; gap: 10px; flex-grow: 1;
        }
        .route-row { display: flex; align-items: center; gap: 10px; position: relative;}
        .route-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; width: 40px;}
        
        /* Native Dropdowns Styled Cleanly */
        .route-select {
            width: 100%; border: none; background: transparent; font-size: 14px; font-weight: 700; color: var(--text-dark);
            font-family: 'Inter', sans-serif; appearance: none; outline: none; cursor: pointer;
            text-overflow: ellipsis; white-space: nowrap; overflow: hidden; padding-right: 15px;
        }
        .route-select:focus { color: var(--primary-orange); }
        .route-row::after {
            content: '▼'; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            font-size: 10px; color: var(--text-muted); pointer-events: none;
        }
        
        /* Swap Button */
        .swap-btn {
            background: #F8FAFC; color: var(--primary-orange); border: 1px solid var(--border-color);
            border-radius: 12px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); flex-shrink: 0;
        }
        .swap-btn:hover { background: #E2E8F0; transform: scale(1.05); }

        .sheet-metrics {
            display: flex; justify-content: space-between; background: #FFFFFF; padding: 12px 16px; 
            border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 10px;
        }
        .s-metric { display: flex; flex-direction: column; }
        .s-metric span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700;}
        .s-metric strong { font-size: 15px; color: var(--text-dark); font-weight: 800; margin-top: 2px;}

        .btn-massive {
            background: var(--primary-orange); color: white; border: none; padding: 16px;
            border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 90, 0, 0.3); transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; flex-shrink: 0;
        }
        .btn-massive:hover { background: var(--primary-orange-hover); transform: translateY(-2px); }

        /* --- APP CHOICE MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            z-index: 9999; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-card {
            background: white; border-radius: 20px; width: 90%; max-width: 360px;
            padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; gap: 20px; transform: scale(0.95); transition: transform 0.2s;
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        
        .modal-header { text-align: center; }
        .modal-header h3 { margin: 0 0 8px 0; font-size: 18px; color: var(--text-dark); font-weight: 800;}
        .modal-header p { margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.4;}

        .app-grid { display: flex; flex-direction: column; gap: 12px; }
        
        .app-btn {
            display: flex; align-items: center; gap: 16px; padding: 16px 20px;
            border-radius: 12px; border: 2px solid var(--border-color); background: white;
            cursor: pointer; transition: all 0.2s; text-align: left;
        }
        .app-btn:hover { border-color: var(--primary-orange); background: #FFF5F0; }
        .app-btn img, .app-btn svg { width: 32px; height: 32px; border-radius: 8px;}
        .app-btn span { font-size: 16px; font-weight: 700; color: var(--text-dark); }
        
        .modal-close {
            background: #F1F5F9; color: var(--text-muted); border: none; padding: 12px;
            border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 100%;
        }
        .modal-close:hover { background: #E2E8F0; color: var(--text-dark); }

        .custom-search-pin { display: flex; align-items: center; justify-content: center; }
        .preview-origin-pin { filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.3)); }

        /* --- DATA VIEW (TABLE & SUGGESTIONS) --- */
        #data-container {
            display: none; flex-direction: column; height: 100%; padding: 24px; box-sizing: border-box; gap: 24px; overflow: hidden;
        }
        .data-panel-top {
            flex: 3; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; 
            display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow: hidden;
        }
        .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #F8FAFC; }
        .panel-header h2 { margin: 0; font-size: 16px; font-weight: 800; color: var(--text-dark); }
        .table-wrapper { flex-grow: 1; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { position: sticky; top: 0; background: var(--bg-card); padding: 12px 20px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; border-bottom: 2px solid var(--border-color); z-index: 10;}
        td { padding: 14px 20px; font-size: 13px; font-weight: 500; border-bottom: 1px solid var(--border-color); color: var(--text-dark); }
        
        tbody tr:not(.sub-row) { cursor: pointer; transition: background 0.2s; }
        tbody tr:not(.sub-row):hover { background-color: #F1F5F9; }
        tbody tr.selected:not(.sub-row) { background-color: #FFF5F0; border-left: 4px solid var(--primary-orange); }

        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .status-optimal { background: var(--status-green-bg); color: var(--status-green); }
        .status-medium { background: var(--status-yellow-bg); color: var(--status-yellow); }
        .status-over { background: var(--status-red-bg); color: var(--status-red); }
        .status-under { background: var(--status-blue-bg); color: var(--status
