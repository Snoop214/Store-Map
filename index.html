<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS_Store Location</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* UI/UX & Design System - Ultra Compact & Clean Theme */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary-orange: #FF5A00;
            --bg-light: #F8FAFC;
            --white: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --sidebar-width: 370px;
        }

        body {
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Advanced Sidebar Container Architecture */
        .sidebar-container {
            position: relative;
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--white);
            border-right: 1px solid var(--border-color);
            box-shadow: 2px 0 20px rgba(0,0,0,0.05);
            z-index: 1000;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
        }

        .sidebar-container.collapsed {
            width: 35px; 
        }

        .sidebar-content-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .sidebar-content {
            width: var(--sidebar-width);
            height: 100%;
            padding: 24px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: opacity 0.2s ease;
        }

        .sidebar-container.collapsed .sidebar-content {
            opacity: 0;
            pointer-events: none;
        }

        /* The Minimize/Maximize Arrow Button */
        .sidebar-toggle {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: -34px; 
            width: 34px;
            height: 110px; 
            background-color: var(--white);
            border: 1px solid var(--border-color);
            border-left: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-orange);
            box-shadow: 3px 0 8px rgba(0,0,0,0.06);
            z-index: 1001;
            transition: background-color 0.2s;
        }

        .sidebar-toggle:hover {
            background-color: #FFF7F5;
        }

        .sidebar-toggle svg {
            width: 30px; 
            height: 30px;
            transition: transform 0.3s ease;
        }

        .sidebar-container.collapsed .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        /* Internal Panel Styling */
        .logo {
            color: var(--primary-orange);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .upload-section {
            background-color: #FFF7F5;
            border: 1px dashed #FFD0B8;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 24px;
        }

        .upload-section input[type="file"] { display: none; }

        .upload-btn {
            background-color: var(--primary-orange);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: inline-block;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(255, 90, 0, 0.2);
        }

        .upload-status { font-size: 12px; color: var(--text-muted); margin-top: 8px; display: block; font-weight: 500;}

        .control-group { margin-bottom: 24px; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        label.section-title {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .shortcut-btn {
            font-size: 10px;
            color: var(--primary-orange);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 700;
            padding: 0 2px;
        }
        .shortcut-btn:hover { text-decoration: underline; }

        .checkbox-list {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            max-height: 160px;
            overflow-y: auto;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dark);
        }
        .checkbox-item:last-child { margin-bottom: 0; }

        .checkbox-item input {
            margin-right: 10px;
            cursor: pointer;
            width: 14px;
            height: 14px;
            accent-color: var(--primary-orange);
            flex-shrink: 0;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .count-badge {
            color: var(--text-muted);
            font-size: 10px;
            margin-left: auto;
            background: #E2E8F0;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 700;
            white-space: nowrap; 
            flex-shrink: 0; 
        }

        .info-panel {
            background-color: var(--white);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--primary-orange);
            margin-top: auto;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .info-panel h3 { color: var(--text-dark); margin: 0 0 8px 0; font-size: 13px; font-weight: 800; }
        .info-panel p { margin: 0; font-size: 12px; color: var(--text-muted); white-space: pre-line; line-height: 1.5; font-weight: 500;}

        .app-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: auto;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
        }
        .app-footer strong { color: var(--text-dark); font-weight: 700; }

        /* Leaflet Map Interactive Layout */
        .leaflet-popup-content b { color: var(--text-dark); font-size: 14px; font-weight: 800; display: block; margin-bottom: 4px;}
        .leaflet-popup-content { font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.6; min-width: 230px; color: #334155; }
        .popup-label { color: var(--text-muted); font-weight: 600; width: 80px; display: inline-block; font-size: 10px; text-transform: uppercase;}
        .popup-link { color: var(--primary-orange); text-decoration: none; font-weight: 600; }

        .muted-champ-label {
            background: #FFFFFF !important;
            border: 1px solid #E2E8F0 !important;
            border-radius: 12px !important;
            padding: 2px 6px !important;
            font-size: 9px !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 700 !important;
            color: #475569 !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08) !important;
            white-space: nowrap;
        }
        
        #map { flex-grow: 1; height: 100%; z-index: 1;}
    </style>
</head>
<body>

    <div class="sidebar-container" id="sidebar">
        
        <div class="sidebar-content-wrapper">
            <div class="sidebar-content">
                <div class="logo">LS_Store Location</div>

                <div class="upload-section">
                    <label for="csv-file" class="upload-btn">Upload Dataset</label>
                    <input type="file" id="csv-file" accept=".csv" onchange="handleFileUpload(event)">
                    <span class="upload-status" id="upload-status">Awaiting CSV...</span>
                </div>

                <div class="control-group">
                    <div class="section-header">
                        <label class="section-title">1. Supervisors</label>
                        <div>
                            <button class="shortcut-btn" onclick="toggleAllCheckboxes('supervisor-list', true)">Select All</button>
                            <button class="shortcut-btn" onclick="toggleAllCheckboxes('supervisor-list', false)">Clear All</button>
                        </div>
                    </div>
                    <div id="supervisor-list" class="checkbox-list">
                        <div style="color: #94A3B8; font-size: 11px; text-align: center; padding: 10px 0; font-weight: 500;">Load CSV to populate</div>
                    </div>
                </div>

                <div class="control-group">
                    <div class="section-header">
                        <label class="section-title">2. Filter by Chain</label>
                        <div>
                            <button class="shortcut-btn" onclick="toggleAllCheckboxes('chain-list', true)">Select All</button>
                            <button class="shortcut-btn" onclick="toggleAllCheckboxes('chain-list', false)">Clear All</button>
                        </div>
                    </div>
                    <div id="chain-list" class="checkbox-list">
                        <div style="color: #94A3B8; font-size: 11px; text-align: center; padding: 10px 0; font-weight: 500;">Load CSV to populate</div>
                    </div>
                </div>

                <div class="control-group">
                    <div class="section-header">
                        <label class="section-title">3. Focus on Champions</label>
                        <div>
                            <button class="shortcut-btn" onclick="toggleAllCheckboxes('champion-list', true)">Select All</button>
                            <button class="shortcut-btn" onclick="toggleAllCheckboxes('champion-list', false)">Clear All</button>
                        </div>
                    </div>
                    <div id="champion-list" class="checkbox-list">
                        <div style="color: #94A3B8; font-size: 11px; text-align: center; padding: 10px 0; font-weight: 500;">Select options above</div>
                    </div>
                </div>

                <div class="info-panel" id="info-panel" style="display: none;">
                    <h3 id="panel-title">Overview</h3>
                    <p id="panel-stats"></p>
                </div>

                <div class="app-footer">
                    LS Operations v9.0<br>
                    Developed by <strong>Soe Naing</strong>
                </div>
            </div>
        </div>

        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        const map = L.map('map').setView([25.2048, 55.2708], 9);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const markerLayer = L.layerGroup().addTo(map);
        const routeLayer = L.layerGroup().addTo(map);

        let parsedData = [];
        let supervisorStats = {}; 
        let supervisorColors = {}; 
        
        const colorPalette = ['#FF5A00', '#3B82F6', '#10B981', '#8B5CF6', '#EF4444', '#06B6D4', '#F59E0B', '#F43F5E'];

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            
            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        }

        function getOuterBoundary(coords) {
            if (coords.length <= 3) return coords; 
            let points = coords.slice().sort((a, b) => a[1] !== b[1] ? a[1] - b[1] : a[0] - b[0]);
            const cross = (o, a, b) => (a[1] - o[1]) * (b[0] - o[0]) - (a[0] - o[0]) * (b[1] - o[1]);
            let lower = [];
            for (let p of points) {
                while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
                lower.push(p);
            }
            let upper = [];
            for (let i = points.length - 1; i >= 0; i--) {
                let p = points[i];
                while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
                upper.push(p);
            }
            lower.pop(); upper.pop();
            return lower.concat(upper);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('upload-status').innerText = "Parsing...";
            document.getElementById('upload-status').style.color = '#FF5A00';

            Papa.parse(file, {
                header: true, 
                skipEmptyLines: true,
                complete: function(results) {
                    processSmartData(results.data);
                },
                error: function(err) {
                    alert("Error reading file.");
                }
            });
        }

        function processSmartData(dataRows) {
            parsedData = []; supervisorStats = {}; supervisorColors = {};

            parsedData = dataRows.map(row => {
                const clean = (keyOptions) => {
                    for (let key of keyOptions) {
                        if (row[key] !== undefined) return row[key].trim();
                        let foundKey = Object.keys(row).find(k => k.trim() === key);
                        if (foundKey && row[foundKey] !== undefined) return row[foundKey].trim();
                    }
                    return "";
                };

                const lat = parseFloat(clean(["Latitude"]));
                const lng = parseFloat(clean(["Longitude"]));
                
                if (isNaN(lat) || isNaN(lng)) return null;

                const sup = clean(["Supervisor"]) || "Unknown";
                const champ = clean(["Name", "Champion Name"]) || "Unknown";
                const chain = clean(["Chain Nam", "Chain Name"]) || "Unknown";

                if (!supervisorStats[sup]) supervisorStats[sup] = new Set();
                supervisorStats[sup].add(champ);

                return {
                    championName: champ, supervisor: sup, chainName: chain,
                    chainId: clean(["Chain ID", "Chain id"]) || "N/A",
                    vendorId: clean(["Vendor ID", "Vendor id"]) || "N/A",
                    vendorName: clean(["Vendor Na", "Vendor Name"]) || "Unknown",
                    locationName: clean(["Location", "Branch Loc"]) || "Store",
                    email: clean(["Email", "Email ID"]) || "N/A", 
                    mobile: clean(["Mobile Num", "Mobile Number"]) || "N/A",
                    lat: lat, lng: lng
                };
            }).filter(item => item !== null);

            if (parsedData.length === 0) {
                document.getElementById('upload-status').innerText = "❌ Error";
                document.getElementById('upload-status').style.color = 'red';
                return;
            }

            document.getElementById('upload-status').innerText = `✅ Loaded ${parsedData.length}`;
            document.getElementById('upload-status').style.color = '#10B981';

            buildSupervisorFilterList();
            buildChainFilterList(true);
        }

        function buildSupervisorFilterList() {
            const supList = document.getElementById('supervisor-list'); supList.innerHTML = '';
            let colorIndex = 0;
            Object.keys(supervisorStats).sort().forEach(sup => {
                if (sup === "Unknown") return;
                const assignedColor = colorPalette[colorIndex % colorPalette.length];
                supervisorColors[sup] = assignedColor; colorIndex++;
                
                supList.innerHTML += `
                    <label class="checkbox-item">
                        <input type="checkbox" value="${sup}" onchange="handleFiltersChange()">
                        <span class="color-dot" style="background-color: ${assignedColor};"></span>
                        <span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${sup}</span> 
                        <span class="count-badge">${supervisorStats[sup].size} Champs</span>
                    </label>
                `;
            });
        }

        function buildChainFilterList(checkAll = false) {
            const chainList = document.getElementById('chain-list');
            const previouslyCheckedChains = checkAll ? [] : getCheckedValues('chain-list');
            chainList.innerHTML = '';

            let selectedSups = getCheckedValues('supervisor-list');
            let chainStoreCounts = {};

            parsedData.forEach(d => {
                if (selectedSups.length === 0 || selectedSups.includes(d.supervisor)) {
                    if (d.chainName !== "Unknown") {
                        chainStoreCounts[d.chainName] = (chainStoreCounts[d.chainName] || 0) + 1;
                    }
                }
            });

            Object.keys(chainStoreCounts).sort().forEach(chain => {
                const isChecked = (checkAll || previouslyCheckedChains.includes(chain)) ? 'checked' : '';
                const count = chainStoreCounts[chain];
                chainList.innerHTML += `
                    <label class="checkbox-item">
                        <input type="checkbox" value="${chain}" onchange="handleChainChange()" ${isChecked}>
                        <span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${chain}</span>
                        <span class="count-badge">${count} Stores</span>
                    </label>
                `;
            });
        }

        function toggleAllCheckboxes(listId, checkState) {
            const checkboxes = document.querySelectorAll(`#${listId} input[type="checkbox"]`);
            checkboxes.forEach(cb => cb.checked = checkState);
            if (listId === 'supervisor-list') handleFiltersChange();
            else handleChainChange();
        }

        function getCheckedValues(listId) {
            return Array.from(document.querySelectorAll(`#${listId} input:checked`)).map(cb => cb.value);
        }

        // TINTED PASTEL BACKGROUNDS WITH BOLD BRAND TEXT COLORS
        function getCustomIcon(chainName, supervisorColor) {
            const lowerChain = chainName.toLowerCase();
            
            // Default styling
            let brandBgColor = "#E2E8F0"; 
            let brandTextColor = "#475569";

            if (lowerChain.includes("carrefour")) {
                brandBgColor = "#DCE9F9"; // Light Blue
                brandTextColor = "#0054A6"; // Carrefour Blue
            } else if (lowerChain.includes("lulu")) {
                brandBgColor = "#D5EEDD"; // Light Green
                brandTextColor = "#007B3A"; // Lulu Green
            } else if (lowerChain.includes("viva")) {
                brandBgColor = "#FAD2D8"; // Light Red
                brandTextColor = "#B71234"; // Viva Red
            } else if (lowerChain.includes("sava")) {
                brandBgColor = "#FEF0B5"; // Light SAVA Yellow
                brandTextColor = "#0047BB"; // SAVA Strong Blue
            } else if (lowerChain.includes("union coop")) {
                brandBgColor = "#D4E6DB"; // Light Pine
                brandTextColor = "#0B4226"; // Union Coop Pine
            } else if (lowerChain.includes("adcoop")) {
                brandBgColor = "#D7DFE8"; // Light Navy
                brandTextColor = "#102640"; // Adcoop Navy
            } else if (lowerChain.includes("safeer")) {
                brandBgColor = "#D8EEFA"; // Light Cyan-Blue
                brandTextColor = "#0B6B99"; // Safeer Blue
            }

            const displayLabel = chainName.trim().toUpperCase();

            return L.divIcon({
                className: 'brand-solid-marker',
                html: `<div style="
                    background-color: ${brandBgColor}; 
                    color: ${brandTextColor}; 
                    border: 2.5px solid ${supervisorColor}; 
                    border-radius: 50%; 
                    width: 44px; 
                    height: 44px; 
                    display: flex; 
                    align-items: center; 
                    justify-content: center; 
                    box-shadow: inset 0 0 0 1.5px #FFFFFF, 0 3px 8px rgba(0,0,0,0.25); 
                    font-family: 'Inter', sans-serif;
                    font-size: 6.2px; 
                    font-weight: 800; 
                    text-align: center; 
                    box-sizing: border-box; 
                    word-break: break-word; 
                    line-height: 1.1; 
                    padding: 3px;
                    letter-spacing: 0.1px;">${displayLabel}</div>`,
                iconSize: [46, 46], 
                iconAnchor: [23, 23]
            });
        }

        function handleFiltersChange() {
            buildChainFilterList(false);
            updateChampionDropdownScope();
        }

        function handleChainChange() {
            updateChampionDropdownScope();
        }

        function updateChampionDropdownScope() {
            const selectedSups = getCheckedValues('supervisor-list');
            const selectedChains = getCheckedValues('chain-list');
            const previouslyCheckedChamps = getCheckedValues('champion-list');
            const champList = document.getElementById('champion-list');

            if (selectedSups.length === 0 || selectedChains.length === 0) {
                champList.innerHTML = '<div style="color: #94A3B8; font-size: 11px; text-align: center; padding: 10px 0; font-weight: 500;">Select Options Above</div>';
                document.getElementById('info-panel').style.display = 'none';
                markerLayer.clearLayers(); routeLayer.clearLayers(); return;
            }

            champList.innerHTML = '';
            let champStoreCounts = {};
            parsedData.forEach(d => {
                if (selectedSups.includes(d.supervisor) && selectedChains.includes(d.chainName)) {
                    champStoreCounts[d.championName] = (champStoreCounts[d.championName] || 0) + 1;
                }
            });

            Object.keys(champStoreCounts).sort().forEach(champ => {
                const isChecked = previouslyCheckedChamps.includes(champ) ? 'checked' : '';
                const storeCount = champStoreCounts[champ];
                champList.innerHTML += `
                    <label class="checkbox-item">
                        <input type="checkbox" value="${champ}" onchange="renderMap()" ${isChecked}>
                        <span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${champ}</span>
                        <span class="count-badge">${storeCount} Stores</span>
                    </label>
                `;
            });
            renderMap();
        }

        function renderMap() {
            markerLayer.clearLayers(); routeLayer.clearLayers();
            const selectedSups = getCheckedValues('supervisor-list');
            const selectedChains = getCheckedValues('chain-list');
            const selectedChamps = getCheckedValues('champion-list');
            
            const noChampsSelected = selectedChamps.length === 0;
            
            let allBounds = []; 
            let totalStores = 0;
            let activeChampsCount = new Set();

            let supervisorStorePools = {};
            selectedSups.forEach(sup => { supervisorStorePools[sup] = []; });

            parsedData.forEach(store => {
                if (selectedSups.includes(store.supervisor) && selectedChains.includes(store.chainName)) {
                    if (noChampsSelected || selectedChamps.includes(store.championName)) {
                        
                        const supColor = supervisorColors[store.supervisor] || '#FF5A00';
                        
                        const popupHTML = `
                            <b>${store.locationName}</b>
                            <span class="popup-label">Chain ID:</span> ${store.chainId}<br>
                            <span class="popup-label">Chain:</span> <strong style="color:var(--text-dark);">${store.chainName}</strong><br>
                            <span class="popup-label">Vendor ID:</span> ${store.vendorId}<br>
                            <span class="popup-label">Vendor:</span> ${store.vendorName}<br>
                            <span class="popup-label">Champ:</span> <strong style="color:var(--primary-orange);">${store.championName}</strong><br>
                            <span class="popup-label">Sup:</span> ${store.supervisor}<br>
                            <hr style="border:0; border-top:1px solid var(--border-color); margin:8px 0;">
                            <span class="popup-label">Mobile:</span> <a class="popup-link" href="tel:${store.mobile.replace(/\s/g, '')}">${store.mobile}</a><br>
                            <span class="popup-label">Mail ID:</span> <a class="popup-link" href="mailto:${store.email}">${store.email}</a>
                        `;

                        const storeMarker = L.marker([store.lat, store.lng], { icon: getCustomIcon(store.chainName, supColor) })
                         .bindPopup(popupHTML)
                         .addTo(markerLayer);
                        
                        storeMarker.bindTooltip(store.championName, {
                            permanent: true,
                            direction: 'bottom',
                            className: 'muted-champ-label',
                            offset: [0, 16]
                        });
                        
                        allBounds.push([store.lat, store.lng]);
                        activeChampsCount.add(store.championName);
                        totalStores++;

                        if (noChampsSelected) {
                            supervisorStorePools[store.supervisor].push([store.lat, store.lng]);
                        } else {
                            if (!supervisorStorePools[store.championName]) {
                                supervisorStorePools[store.championName] = { color: supColor, coords: [] };
                            }
                            supervisorStorePools[store.championName].coords.push([store.lat, store.lng]);
                        }
                    }
                }
            });

            if (noChampsSelected) {
                Object.keys(supervisorStorePools).forEach(sup => {
                    const coords = supervisorStorePools[sup];
                    const supColor = supervisorColors[sup] || '#FF5A00';

                    if (coords.length > 1) L.polyline(coords, { color: supColor, weight: 2, dashArray: '4, 6', opacity: 0.4 }).addTo(routeLayer);
                    if (coords.length >= 3) {
                        const outerBoundary = getOuterBoundary(coords);
                        L.polygon(outerBoundary, { color: supColor, fillColor: supColor, fillOpacity: 0.1, weight: 1.5 }).addTo(routeLayer);
                    } else if (coords.length > 0) {
                        L.circle(coords[0], { color: supColor, fillColor: supColor, fillOpacity: 0.08, radius: 2500 }).addTo(routeLayer);
                    }
                });
            } else {
                Object.keys(supervisorStorePools).forEach(champ => {
                    const group = supervisorStorePools[champ];
                    if (group.coords.length > 1) L.polyline(group.coords, { color: group.color, weight: 3, dashArray: '5, 8', opacity: 0.7 }).addTo(routeLayer);
                    if (group.coords.length >= 3) {
                        const outerBoundary = getOuterBoundary(group.coords);
                        L.polygon(outerBoundary, { color: group.color, fillColor: group.color, fillOpacity: 0.2, weight: 2 }).addTo(routeLayer);
                    } else if (group.coords.length > 0) {
                        L.circle(group.coords[0], { color: group.color, fillColor: group.color, fillOpacity: 0.15, radius: 2000 }).addTo(routeLayer);
                    }
                });
            }

            const panel = document.getElementById('info-panel'); panel.style.display = 'block';
            document.getElementById('panel-title').innerText = noChampsSelected ? `Supervisor Overview` : `Focused Operations`;
            document.getElementById('panel-stats').innerText = `Active Champions: ${activeChampsCount.size}\nTotal Mapped Stores: ${totalStores}`;
            
            if (allBounds.length > 0) map.fitBounds(allBounds, { padding: [50, 50] });
        }
    </script>
</body>
</html>
